[project]
name = "enterprise-ai-platform"
version = "0.1.0"
description = "面向万店级连锁餐饮集团的企业级 AI 平台（数据中台 / 评测中台 / 业务智能体矩阵）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pymilvus>=2.4",
    "elasticsearch>=8.13",
    "sqlglot>=30.30.0",
    "uvicorn>=0.30",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_platform", "eval_platform", "agent_matrix", "web_console", "mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
